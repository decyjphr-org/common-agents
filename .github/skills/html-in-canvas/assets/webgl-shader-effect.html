<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HTML-in-Canvas — WebGL ripple shader on live HTML</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* The drawn element fills the canvas so its layout box already matches the
     full-screen quad. See references/synchronization.md for 3D placements. */
  #page {
    width: 100vw; height: 100vh; box-sizing: border-box; padding: 48px;
    background: linear-gradient(135deg, #1e1b4b, #0f766e); color: #f8fafc;
    font: 18px/1.5 system-ui, sans-serif;
  }
  #page h1 { font-size: 48px; margin: 0 0 12px; }
  #page a, #page button { color: #fde68a; font: inherit; }
</style>
</head>
<body>
  <canvas id="c" layoutsubtree>
    <article id="page">
      <h1>Shaders on real HTML</h1>
      <p>This is live, selectable, accessible DOM — uploaded as a WebGL texture every paint.</p>
      <p><button id="b">Interactive button</button> <a href="#">A real link</a></p>
      <p>Move your pointer to create ripples.</p>
    </article>
  </canvas>

<script type="module">
  const canvas = document.getElementById('c');
  const page = document.getElementById('page');
  const gl = canvas.getContext('webgl2');

  if (!gl || !('texElementImage2D' in gl) || !('requestPaint' in canvas)) {
    // Fallback: show the HTML normally, no effect.
    canvas.removeAttribute('layoutsubtree');
    canvas.replaceWith(page);
    throw new Error('WebGL HTML-in-Canvas unsupported — showing plain HTML');
  }

  // Set true if the texture renders upside down on your build (UV convention differs).
  const FLIP_Y = true;

  const vs = `#version 300 es
    in vec2 pos; out vec2 uv;
    void main() { uv = pos * 0.5 + 0.5; gl_Position = vec4(pos, 0.0, 1.0); }`;
  const fs = `#version 300 es
    precision highp float;
    in vec2 uv; out vec4 color;
    uniform sampler2D tex; uniform vec2 mouse; uniform float time; uniform bool flipY;
    void main() {
      vec2 p = uv;
      float d = distance(p, mouse);
      // Small, decaying ripple — keep distortion light so hit testing stays usable.
      p += normalize(p - mouse + 1e-5) * sin(d * 60.0 - time * 6.0) * 0.004 * smoothstep(0.35, 0.0, d);
      if (flipY) p.y = 1.0 - p.y;
      color = texture(tex, p);
    }`;

  const compile = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'pos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const tex = gl.createTexture();
  const uMouse = gl.getUniformLocation(prog, 'mouse');
  const uTime = gl.getUniformLocation(prog, 'time');
  gl.uniform1i(gl.getUniformLocation(prog, 'flipY'), FLIP_Y ? 1 : 0);

  const mouse = [0.5, 0.5];
  canvas.addEventListener('pointermove', (e) => {
    mouse[0] = e.clientX / canvas.clientWidth;
    mouse[1] = 1 - e.clientY / canvas.clientHeight;
  });
  document.getElementById('b').addEventListener('click', (e) => { e.target.textContent = 'Clicked!'; });

  new ResizeObserver(([e]) => {
    canvas.width = e.devicePixelContentBoxSize[0].inlineSize;
    canvas.height = e.devicePixelContentBoxSize[0].blockSize;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }).observe(canvas, { box: 'device-pixel-content-box' });

  canvas.onpaint = () => {
    // Upload the live HTML as a texture (inside paint = current frame).
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texElementImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, page);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

    gl.uniform2fv(uMouse, mouse);
    gl.uniform1f(uTime, performance.now() / 1000);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // Sync: the element fills the canvas at its layout position, so no transform
    // is needed here. For meshes in 3D, use canvas.getElementTransform(page, drawMatrix).
    canvas.requestPaint(); // animate the ripple
  };
  canvas.requestPaint();
</script>
</body>
</html>
